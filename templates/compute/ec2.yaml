AWSTemplateFormatVersion: '2010-09-09'
Description: 'Fixed EC2 instance CloudFormation template'

Parameters:
  ProjectName:
    Type: String
    Default: cf-ec2-rds-vpc-sns
    Description: Project name used for tagging
    
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
      - staging
    Description: Deployment environment
    
  KeyPairName:
    Description: Name of existing EC2 KeyPair for SSH access
    Type: AWS::EC2::KeyPair::RDS-EC2-keypair

  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI ID
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

Resources:
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyPairName
      SubnetId: !ImportValue 
        Fn::Sub: "${ProjectName}-${Environment}-PublicSubnet1Id"
      SecurityGroupIds:
        - !ImportValue 
          Fn::Sub: "${ProjectName}-${Environment}-EC2-SGID"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y httpd mysql80-community-release-el9-1.noarch php php-mysqli
          systemctl start httpd
          systemctl enable httpd
          
          cat > /var/www/html/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>RDS-EC2 Project</title>
          </head>
          <body>
              <h1>Welcome to ${ProjectName}</h1>
              <h2>Environment: ${Environment}</h2>
              <p>Web server is running successfully!</p>
          </body>
          </html>
          EOF
          
          chown apache:apache /var/www/html/index.html
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-web-server'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EC2-InstanceID'

  PublicIP:
    Description: Public IP address
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EC2-PublicIP'

  WebsiteURL:
    Description: Website URL
    Value: !Sub 'http://${EC2Instance.PublicIp}'